name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.3.0"
        required: true
        type: string
      source_ref:
        description: "Git ref to validate"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-Cdebuginfo=0"

jobs:
  crates:
    name: crates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-bin: "false"

      - name: Install LLVM for upstream conformance
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Run Python maintenance-tool tests
        run: python3 -m unittest discover -s tools/tests

      - name: Validate release semver profile
        run: python3 tools/semver_audit.py --release-version "${{ inputs.version }}" --validate-only

      - name: Check changelog release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/changelog.py check-soft-wrap --version "${{ inputs.version }}"
          python3 tools/changelog.py extract --version "${{ inputs.version }}" --output release-notes.md
          test -s release-notes.md

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.48.0 --locked

      - name: Audit release semver breaks
        run: python3 tools/semver_audit.py --release-version "${{ inputs.version }}"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate Pages content
        run: cargo run -p xtask -- validate-pages

      - name: Validate official sample parity matrix
        run: cargo run -p xtask -- sample-parity --check

      - name: Checkout pinned Box3D source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          manifest = tomllib.loads(pathlib.Path("boxddd-sys/box3d-upstream.toml").read_text())
          repository = manifest["upstream"]["repository"]
          commit = manifest["upstream"]["commit"]
          source = pathlib.Path(os.environ["RUNNER_TEMP"]) / "box3d-upstream"
          subprocess.run(["git", "init", str(source)], check=True)
          subprocess.run(["git", "-C", str(source), "remote", "add", "origin", repository], check=True)
          subprocess.run(["git", "-C", str(source), "fetch", "--depth", "1", "origin", commit], check=True)
          subprocess.run(["git", "-C", str(source), "checkout", "--detach", commit], check=True)
          actual = subprocess.run(
              ["git", "-C", str(source), "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if actual != commit:
              raise SystemExit(f"expected Box3D {commit}, checked out {actual}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"BOXDDD_UPSTREAM_SOURCE={source}\n")
          PY

      - name: Check pinned upstream conformance
        run: python3 tools/update_box3d_and_bindings.py check --source "$BOXDDD_UPSTREAM_SOURCE" --mode both

      - name: Build package archives
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p boxddd-sys --locked
          cargo package -p boxddd --locked --config 'patch.crates-io.boxddd-sys.path="boxddd-sys"'
          cargo package -p bevy_boxddd --locked --config 'patch.crates-io.boxddd.path="boxddd"' --config 'patch.crates-io.boxddd-sys.path="boxddd-sys"'

      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p boxddd | sed -E 's/.*[@#]//')"
          sys_crate="target/package/boxddd-sys-${version}.crate"
          core_crate="target/package/boxddd-${version}.crate"
          bevy_crate="target/package/bevy_boxddd-${version}.crate"

          for crate in "$sys_crate" "$core_crate" "$bevy_crate"; do
            list="${crate}.list"
            tar -tf "$crate" | tee "$list" >/dev/null
            if grep -E '(^|/)(repo-ref|target|\.github)(/|$)|(^|/)docs/plans/' "$list"; then
              echo "::error::$crate contains non-publishable workspace content"
              exit 1
            fi
          done

          assert_root_readme_contains() {
            local crate="$1"
            local needle="$2"
            local readme
            readme="$(tar -tf "$crate" | awk '/^[^/]+\/README\.md$/ && !found { print; found=1 }')"
            if [ -z "$readme" ]; then
              echo "::error::$crate is missing its root README.md"
              exit 1
            fi
            tar -xOf "$crate" "$readme" | grep -F "$needle" >/dev/null
          }

          tar -tf "$sys_crate" | grep -F '/README.md'
          tar -tf "$sys_crate" | grep -F '/box3d-upstream.toml'
          tar -tf "$sys_crate" | grep -F '/patches/0001-emscripten-single-thread-timer.patch'
          tar -tf "$sys_crate" | grep -F '/provider/debug_callbacks.c'
          tar -tf "$sys_crate" | grep -F '/src/bindings_pregenerated.rs'
          tar -tf "$sys_crate" | grep -F '/src/bindings_pregenerated_double.rs'
          tar -tf "$sys_crate" | grep -F '/third-party/box3d/LICENSE'
          if grep -E '/third-party/box3d/(benchmark|docs|extern|samples|test)/' "${sys_crate}.list"; then
            echo "::error::$sys_crate contains Box3D content outside the declared runtime subset"
            exit 1
          fi
          tar -tf "$core_crate" | grep -F '/README.md'
          tar -tf "$core_crate" | grep -F '/examples/README.md'
          tar -tf "$core_crate" | grep -F '/tests/fixtures/api_coverage_symbols.txt'
          tar -tf "$core_crate" | grep -F '/examples/compound_query.rs'
          tar -tf "$core_crate" | grep -F '/examples/events.rs'
          tar -tf "$core_crate" | grep -F '/examples/body_controls.rs'
          tar -tf "$core_crate" | grep -F '/examples/continuous_collision.rs'
          tar -tf "$core_crate" | grep -F '/examples/character_mover.rs'
          tar -tf "$core_crate" | grep -F '/examples/mesh_height_field_query.rs'
          tar -tf "$core_crate" | grep -F '/examples/glam_interop.rs'
          tar -tf "$core_crate" | grep -F '/examples/nalgebra_interop.rs'
          tar -tf "$core_crate" | grep -F '/examples/dynamic_tree.rs'
          tar -tf "$bevy_crate" | grep -F '/README.md'
          tar -tf "$bevy_crate" | grep -F '/examples/README.md'
          tar -tf "$bevy_crate" | grep -F '/examples/advanced_colliders_3d.rs'
          tar -tf "$bevy_crate" | grep -F '/examples/joint_gallery_3d.rs'
          tar -tf "$bevy_crate" | grep -F '/examples/testbed_3d/main.rs'
          tar -tf "$bevy_crate" | grep -F '/examples/testbed_3d/scenes.rs'

          assert_root_readme_contains "$core_crate" 'docs/upstream-parity/box3d-sample-matrix.md'
          assert_root_readme_contains "$bevy_crate" 'docs/upstream-parity/box3d-sample-matrix.md'

      - name: Dry-run registry-independent crate
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if cargo info "boxddd-sys@$version" --registry crates-io >/dev/null 2>&1; then
            echo "Skipping boxddd-sys $version dry-run because it is already published"
            exit 0
          fi
          cargo publish -p boxddd-sys --locked --dry-run --registry crates-io

      - name: Explain downstream dry-run boundary
        run: |
          echo "boxddd and bevy_boxddd dry-runs are performed by release-crates.yml after their registry dependencies are visible."
